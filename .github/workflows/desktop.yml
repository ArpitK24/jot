name: desktop

# Builds the Windows desktop app and its installer. Pushes to main upload a
# test artifact only. A desktop/v* tag (e.g. desktop/v0.3.0) also publishes a
# GitHub release with the installer. It does not touch the MCP Registry,
# which only follows plain v* tags (release.yml).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (default: 0.3.0-dev.<sha>)"
        required: false
  push:
    tags: ["desktop/v*"]
    branches: [main]
    paths:
      - "desktop/**"
      - "packaging/windows/**"
      - "internal/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: desktop/go.sum
      - name: vet and test
        working-directory: desktop
        run: |
          go vet .
          go test ./...
          GOOS=windows go vet .

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: desktop/go.sum
      - name: version
        run: |
          v="${{ github.event.inputs.version }}"
          case "$GITHUB_REF" in refs/tags/desktop/v*) v="${GITHUB_REF#refs/tags/desktop/v}";; esac
          [ -z "$v" ] && v="0.3.0-dev.${GITHUB_SHA::7}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "NUMVERSION=$(echo "$v" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_ENV"
      - name: build CLI
        run: |
          mkdir -p out/cli
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o out/cli/jot.exe ./cmd/jot
          cp README.md LICENSE out/cli/
          out/cli/jot.exe version
      - name: build desktop app
        working-directory: desktop
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
          wails build -platform windows/amd64 -skipbindings -trimpath -ldflags "-X main.version=$VERSION" -o jot-desktop.exe
          ls -la build/bin
      - name: build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=$env:VERSION /DNumVersion=$env:NUMVERSION /DArch=x64 /DSourceDir="$pwd\out\cli" /DDesktopExe="$pwd\desktop\build\bin\jot-desktop.exe" /DOutputDir="$pwd\dist" packaging\windows\jot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - name: smoke test installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/TASKS=addtopath" -Wait
          $dir = "$env:LOCALAPPDATA\Programs\jot"
          Get-ChildItem $dir
          if (-not (Test-Path "$dir\jot-desktop.exe")) { throw "desktop app missing" }
          & "$dir\jot.exe" version
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if ($path -notlike "*$dir*") { throw "jot not added to user PATH" }
          if (-not (Test-Path "$env:USERPROFILE\.jot")) { throw "store not created" }
          # The in-app updater reruns setup silently with /RELAUNCH over a
          # running copy: it must upgrade in place and open jot again.
          Start-Process "$dir\jot-desktop.exe"
          Start-Sleep -Seconds 5
          $t0 = Get-Date
          # Wait on setup itself, not with -Wait: that also waits for the jot
          # window setup reopens, which never exits.
          $upd = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/RELAUNCH" -PassThru
          if (-not $upd.WaitForExit(180000)) { throw "silent update hung" }
          Start-Sleep -Seconds 5
          $p = Get-Process jot-desktop -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -gt $t0 }
          if (-not $p) { throw "jot didn't reopen after a silent update" }
          $p | Stop-Process -Force
          Start-Sleep -Seconds 2
          if (-not (Test-Path "$dir\jot-desktop.exe")) { throw "desktop app missing after update" }
          Write-Host "silent update and relaunch OK"
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 3
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if ($path -like "*$dir*") { throw "uninstall left jot on PATH" }
          Write-Host "install and uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: jot-windows-x64-setup
          path: dist/*-setup.exe
          if-no-files-found: error

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/desktop/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jot-windows-x64-setup
          path: dist
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          v="${tag#desktop/v}"
          (cd dist && sha256sum *-setup.exe > SHA256SUMS.txt)
          cat > notes.md <<EOF
          The jot desktop app for Windows (x64), with the jot command-line tool included.

          **Install:** download \`$(cd dist && ls *-setup.exe)\` and run it. It installs for your user only, with no admin prompt, adds \`jot\` to your PATH and offers to connect Claude Code, Cursor, Codex, Antigravity and Claude Desktop.

          **Unsigned build:** Windows SmartScreen may warn on first run. Click *More info*, then *Run anyway*.

          **Needs:** Windows 10 or 11 with WebView2 (built in on Windows 11). Git for Windows is optional and turns on note history.

          **What's in it:** a library of every note your AI tools saved, search, pin, edit with history, side-by-side duplicate review with merge, a Ctrl+K command palette, and one-click tool setup.

          **Optional semantic search:** with [Ollama](https://ollama.com) running, turn it on in Settings → Search to find notes that say the same thing in other words. jot uses the small \`all-minilm\` model and falls back to keyword search when Ollama isn't there.

          **Updates:** jot checks GitHub when it opens and offers *Update and restart*. The download is checked against \`SHA256SUMS.txt\` before it installs, and your notes are never touched. Turn the check off in Settings → General. Coming from 0.3.0, which has no updater, install this one by hand once.

          **Appearance:** light, dark, or follow the system, in Settings → General.

          Uninstalling removes jot from your tools and PATH. Your notes in \`~/.jot\` stay.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$tag" dist/*-setup.exe dist/SHA256SUMS.txt \
            --title "jot desktop $v for Windows" --notes-file notes.md --latest=false
